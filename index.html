<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>
    <style>
        /* Estilo Apple e Cores Solicitadas */
        :root {
            --verde-militar: #4B5320;
            --verde-limao: #d4ff33;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--verde-militar), var(--verde-limao));
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Efeito Glassmorphism (Vidro Fosco) Apple */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Filtro de Categorias */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--verde-limao);
            color: var(--verde-militar);
            border-color: var(--verde-limao);
            font-weight: bold;
        }

        /* Grid de Portfólio */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
        }

        .portfolio-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.3s ease;
        }

        .portfolio-card:hover {
            transform: translateY(-5px);
        }

        .portfolio-card h3 {
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
        }

        .media-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover;
        }

        .media-container audio {
            width: 100%;
            padding: 10px;
        }

        /* Rodapé e Admin */
        footer {
            text-align: center;
            padding: 30px;
            margin-top: auto;
        }

        .admin-icon {
            cursor: pointer;
            font-size: 1.5rem;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .admin-icon:hover { opacity: 1; }

        /* Painel Admin (Modal) */
        .admin-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .admin-content {
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-admin {
            position: absolute;
            top: 20px; right: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .admin-section {
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 16px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 10px;
            border: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        input, select {
            background: rgba(255,255,255,0.9);
            color: #333;
        }

        button {
            background: var(--verde-limao);
            color: var(--verde-militar);
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu Portfólio</h1>
    </header>

    <div class="categories" id="category-container">
        <!-- Categorias serão injetadas aqui -->
    </div>

    <div class="portfolio-grid" id="portfolio-grid">
        <div class="loading">Carregando portfólio...</div>
    </div>

    <footer>
        <span class="admin-icon" onclick="toggleAdmin()">🔒</span>
    </footer>

    <!-- Painel Administrador -->
    <div class="admin-modal" id="admin-modal">
        <div class="glass admin-content">
            <span class="close-admin" onclick="toggleAdmin()">X</span>
            <h2 style="margin-top: 0;">Painel de Controle</h2>

            <div class="admin-section">
                <h3>Criar Nova Categoria</h3>
                <input type="text" id="new-category-name" placeholder="Nome da Categoria">
                <button onclick="addCategory()">Adicionar Categoria</button>
            </div>

            <div class="admin-section">
                <h3>Adicionar Arquivo ao Portfólio</h3>
                <input type="text" id="item-title" placeholder="Título do Trabalho">
                
                <select id="item-category">
                    <!-- Opções injetadas via JS -->
                </select>

                <select id="item-type">
                    <option value="imagem">Imagem</option>
                    <option value="video">Vídeo</option>
                    <option value="audio">Áudio</option>
                </select>

                <input type="file" id="item-file" accept="image/*,video/*,audio/*">
                
                <button onclick="addItem()" id="btn-add-item">Fazer Upload e Salvar</button>
            </div>
        </div>
    </div>

    <script>
        // COLOQUE A URL DO SEU GOOGLE APPS SCRIPT AQUI =======================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzWzIg8eyb9LMx82AD25XB9E9ypBcMFMpITZ-zOKWFKf7P2ywAnqqAypZQoIOxngclH4w/exec"; 
        // ====================================================================

        let allItems = [];
        let currentCategory = 'Todas';

        async function carregarDados() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                
                allItems = data.itens;
                renderCategories(data.categorias);
                renderItems();
            } catch (error) {
                document.getElementById('portfolio-grid').innerHTML = "<p>Erro ao carregar dados.</p>";
            }
        }

        function renderCategories(categorias) {
            const container = document.getElementById('category-container');
            const select = document.getElementById('item-category');
            
            container.innerHTML = `<button class="cat-btn active" onclick="filterCategory('Todas', this)">Todas</button>`;
            select.innerHTML = '';

            categorias.forEach(cat => {
                container.innerHTML += `<button class="cat-btn" onclick="filterCategory('${cat}', this)">${cat}</button>`;
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function filterCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('portfolio-grid');
            grid.innerHTML = '';

            const filtrados = currentCategory === 'Todas' 
                ? allItems 
                : allItems.filter(item => item.categoria === currentCategory);

            if (filtrados.length === 0) {
                grid.innerHTML = "<p style='text-align:center; width:100%;'>Nenhum item nesta categoria.</p>";
                return;
            }

            filtrados.forEach(item => {
                let mediaHtml = '';
                if (item.tipo === 'imagem') mediaHtml = `<img src="${item.url}" alt="${item.titulo}">`;
                if (item.tipo === 'video') mediaHtml = `<video src="${item.url}" controls></video>`;
                if (item.tipo === 'audio') mediaHtml = `<audio src="${item.url}" controls></audio>`;

                grid.innerHTML += `
                    <div class="glass portfolio-card">
                        <div class="media-container">${mediaHtml}</div>
                        <h3>${item.titulo}</h3>
                    </div>
                `;
            });
        }

        function toggleAdmin() {
            const modal = document.getElementById('admin-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        async function addCategory() {
            const nome = document.getElementById('new-category-name').value;
            if (!nome) return alert('Digite um nome!');
            
            const btn = event.target;
            btn.innerText = 'Salvando...';

            await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'addCategoria', nome: nome })
            });

            document.getElementById('new-category-name').value = '';
            btn.innerText = 'Adicionar Categoria';
            carregarDados();
        }

        async function addItem() {
            const titulo = document.getElementById('item-title').value;
            const categoria = document.getElementById('item-category').value;
            const tipo = document.getElementById('item-type').value;
            const fileInput = document.getElementById('item-file');
            const btn = document.getElementById('btn-add-item');

            if (!titulo || !fileInput.files[0]) return alert('Preencha título e selecione o arquivo.');

            const file = fileInput.files[0];
            const reader = new FileReader();

            btn.innerText = 'Fazendo Upload... Aguarde';
            btn.disabled = true;

            reader.onload = async function() {
                const base64Str = reader.result.split(',')[1];
                
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'addItem',
                        titulo: titulo,
                        categoria: categoria,
                        tipo: tipo,
                        filename: file.name,
                        mimeType: file.type,
                        base64: base64Str
                    })
                });

                document.getElementById('item-title').value = '';
                fileInput.value = '';
                btn.innerText = 'Fazer Upload e Salvar';
                btn.disabled = false;
                toggleAdmin();
                carregarDados();
            };

            reader.readAsDataURL(file);
        }

        // Inicia carregamento
        carregarDados();
    </script>
</body>
</html>
