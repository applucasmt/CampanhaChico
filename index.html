<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio - Design Apple Verde Militar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #2d5016 0%, #3d6b1e 30%, #7ab648 70%, #9acd32 100%);
      min-height: 100vh;
      color: #1a1a1a;
      background-attachment: fixed;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 80px 20px 60px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      margin: 20px;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: 4em;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .header p {
      font-size: 1.2em;
      color: rgba(255, 255, 255, 0.9);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 40px 0;
      flex-wrap: wrap;
    }

    .nav-tab {
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: white;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      user-select: none;
    }

    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .nav-tab.active {
      background: white;
      color: #2d5016;
      border-color: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transform: scale(1.05);
    }

    /* Content Grid */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      padding: 20px;
    }

    .media-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .media-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .media-preview {
      width: 100%;
      height: 300px;
      background: linear-gradient(135deg, #2d5016 0%, #4a7a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .media-preview img, .media-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .audio-preview {
      background: linear-gradient(135deg, #2d5016, #4a7a2e);
      color: white;
      font-size: 3em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      gap: 15px;
    }

    .audio-icon {
      font-size: 3em;
    }

    .audio-text {
      font-size: 0.4em;
      opacity: 0.8;
    }

    .media-info {
      padding: 25px;
    }

    .media-title {
      font-size: 1.3em;
      font-weight: 600;
      color: #2d5016;
      margin-bottom: 10px;
    }

    .media-type {
      display: inline-block;
      padding: 5px 15px;
      background: linear-gradient(135deg, #2d5016, #4a7a2e);
      color: white;
      border-radius: 20px;
      font-size: 0.9em;
      margin-bottom: 10px;
      text-transform: capitalize;
    }

    .media-date {
      color: #666;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      backdrop-filter: blur(10px);
      animation: modalFadeIn 0.3s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 1000px;
      margin: 50px auto;
      background: white;
      border-radius: 30px;
      padding: 30px;
      max-height: 80vh;
      overflow-y: auto;
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: #2d5016;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.5em;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-close:hover {
      background: #e74c3c;
      transform: rotate(90deg);
    }

    .modal-media {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .modal-media img, .modal-media video {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      background: #f5f5f5;
    }

    .modal-media audio {
      width: 100%;
      margin: 20px 0;
    }

    .modal-title {
      font-size: 2em;
      color: #2d5016;
      margin-bottom: 15px;
    }

    /* Footer Admin Icon */
    .footer {
      text-align: center;
      padding: 40px 20px;
      margin-top: 60px;
    }

    .admin-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .admin-link:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: white;
      font-size: 1.2em;
    }

    .loading-spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: white;
      font-size: 1.3em;
      opacity: 0.8;
      grid-column: 1 / -1;
    }

    .empty-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .error-state {
      text-align: center;
      padding: 40px 20px;
      color: white;
      background: rgba(231, 76, 60, 0.3);
      border-radius: 15px;
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2.5em;
      }
      
      .content-grid {
        grid-template-columns: 1fr;
      }
      
      .nav-tab {
        padding: 12px 20px;
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1>Meu Portfólio</h1>
        <p>Trabalhos criativos em diferentes formatos e estilos</p>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-tabs" id="navTabs">
      <div class="nav-tab active" onclick="changeCategory('Jingle', this)">🎵 Jingle</div>
      <div class="nav-tab" onclick="changeCategory('Placa Pirulito', this)">🏗️ Placa Pirulito</div>
      <div class="nav-tab" onclick="changeCategory('Praginha', this)">🌳 Praginha</div>
    </nav>

    <!-- Content Area -->
    <div class="content-grid" id="contentGrid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Carregando conteúdo...</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
  <a href="admin.html" class="admin-link">
    🔐 Área Administrativa
  </a>
</footer>
  </div>

  <!-- Modal -->
  <div class="modal" id="mediaModal" onclick="closeModalOutside(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // URL do Web App do Google Apps Script
    const API_URL = 'https://script.google.com/macros/s/AKfycbwqdoWCfgflY5MzRWw0BfJJ-Cgg3XiWVpJlQfQA9OrHXD9lSyYjhIY7vbOxvwJdAzN3/exec';
    let currentCategory = 'Jingle';
    
    // Carregar conteúdo inicial
    document.addEventListener('DOMContentLoaded', () => {
      loadCategoryContent(currentCategory);
    });

    function changeCategory(category, element) {
      currentCategory = category;
      
      // Atualizar tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.remove('active');
      });
      element.classList.add('active');
      
      // Carregar conteúdo
      loadCategoryContent(category);
    }

    async function loadCategoryContent(category) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = `
        <div class="loading" style="grid-column: 1 / -1;">
          <div class="loading-spinner"></div>
          <p>Carregando ${category}...</p>
        </div>
      `;
      
      try {
        // Fazer requisição para a API
        const response = await fetch(`${API_URL}?action=list&category=${encodeURIComponent(category)}`);
        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        if (!data.files || data.files.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <div class="empty-icon">📂</div>
              <p>Nenhum arquivo encontrado em ${category}</p>
              <p style="font-size: 0.8em; margin-top: 10px;">Adicione conteúdo através do painel administrativo</p>
            </div>
          `;
          return;
        }
        
        // Renderizar os arquivos
        renderFiles(data.files);
        
      } catch (error) {
        console.error('Erro ao carregar conteúdo:', error);
        grid.innerHTML = `
          <div class="error-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">⚠️</div>
            <p>Erro ao carregar conteúdo</p>
            <p style="font-size: 0.8em; margin-top: 10px;">${error.message}</p>
            <button onclick="loadCategoryContent('${category}')" 
                    style="margin-top: 20px; padding: 10px 20px; background: white; color: #2d5016; 
                           border: none; border-radius: 20px; cursor: pointer; font-weight: 600;">
              Tentar novamente
            </button>
          </div>
        `;
      }
    }

    function renderFiles(files) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '';
      
      files.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.style.animationDelay = `${index * 0.1}s`;
        card.onclick = () => openMedia(file);
        
        let previewHTML = '';
        
        if (file.tipo === 'imagem') {
          previewHTML = `
            <div class="media-preview">
              <img src="${file.url}" alt="${file.titulo}" 
                   onerror="this.parentElement.innerHTML='<div class=\\'audio-preview\\'><span>🖼️</span><span class=\\'audio-text\\'>Imagem não disponível</span></div>'">
            </div>
          `;
        } else if (file.tipo === 'video') {
          previewHTML = `
            <div class="media-preview">
              <video muted>
                <source src="${file.url}" type="video/mp4">
                Seu navegador não suporta vídeos.
              </video>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                          color: white; font-size: 3em; opacity: 0.8; pointer-events: none;">
                ▶️
              </div>
            </div>
          `;
        } else if (file.tipo === 'audio') {
          previewHTML = `
            <div class="audio-preview">
              <span class="audio-icon">🎵</span>
              <span class="audio-text">Áudio</span>
            </div>
          `;
        }
        
        card.innerHTML = `
          ${previewHTML}
          <div class="media-info">
            <div class="media-title">${file.titulo || 'Sem título'}</div>
            <span class="media-type">${file.tipo}</span>
            <div class="media-date">📅 ${file.data || 'Data não disponível'}</div>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    function openMedia(mediaData) {
      const modal = document.getElementById('mediaModal');
      const modalContent = document.getElementById('modalContent');
      
      let mediaHTML = '';
      
      if (mediaData.tipo === 'imagem') {
        mediaHTML = `
          <div class="modal-media">
            <img src="${mediaData.url}" alt="${mediaData.titulo}" 
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23ddd%22 width=%22200%22 height=%22200%22/><text fill=%22%23999%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22>Imagem não disponível</text></svg>'">
          </div>
        `;
      } else if (mediaData.tipo === 'video') {
        mediaHTML = `
          <div class="modal-media">
            <video controls autoplay>
              <source src="${mediaData.url}" type="video/mp4">
              Seu navegador não suporta o elemento de vídeo.
            </video>
          </div>
        `;
      } else if (mediaData.tipo === 'audio') {
        mediaHTML = `
          <div class="modal-media">
            <div style="background: linear-gradient(135deg, #2d5016, #4a7a2e); padding: 40px; 
                        border-radius: 20px; text-align: center; color: white;">
              <div style="font-size: 4em; margin-bottom: 20px;">🎵</div>
              <audio controls style="width: 100%;">
                <source src="${mediaData.url}" type="audio/mpeg">
                Seu navegador não suporta o elemento de áudio.
              </audio>
            </div>
          </div>
        `;
      }
      
      modalContent.innerHTML = `
        ${mediaHTML}
        <h2 class="modal-title">${mediaData.titulo || 'Sem título'}</h2>
        <p style="color: #666;">📅 ${mediaData.data || 'Data não disponível'}</p>
      `;
      
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('mediaModal').style.display = 'none';
      document.body.style.overflow = 'auto';
      
      // Parar vídeos/áudio ao fechar modal
      const modalContent = document.getElementById('modalContent');
      const mediaElements = modalContent.querySelectorAll('video, audio');
      mediaElements.forEach(element => {
        element.pause();
      });
    }

    function closeModalOutside(event) {
      if (event.target === document.getElementById('mediaModal')) {
        closeModal();
      }
    }

    // Fechar modal com ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // Adicionar efeito hover nos cards de vídeo
    document.addEventListener('mouseover', (e) => {
      const videoCard = e.target.closest('.media-card');
      if (videoCard) {
        const video = videoCard.querySelector('video');
        if (video && video.muted) {
          video.play().catch(() => {});
        }
      }
    });

    document.addEventListener('mouseout', (e) => {
      const videoCard = e.target.closest('.media-card');
      if (videoCard) {
        const video = videoCard.querySelector('video');
        if (video) {
          video.pause();
          video.currentTime = 0;
        }
      }
    });
  </script>
</body>
</html>
