<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio - Design Apple Verde Militar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #2d5016 0%, #3d6b1e 30%, #7ab648 70%, #9acd32 100%);
      min-height: 100vh;
      color: #1a1a1a;
      background-attachment: fixed;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 80px 20px 60px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      margin: 20px;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: 4em;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .header p {
      font-size: 1.2em;
      color: rgba(255, 255, 255, 0.9);
      max-width: 600px;
      margin: 0 auto;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 40px 0;
      flex-wrap: wrap;
    }

    .nav-tab {
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: white;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      user-select: none;
    }

    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .nav-tab.active {
      background: white;
      color: #2d5016;
      border-color: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transform: scale(1.05);
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      padding: 20px;
    }

    .media-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .media-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .media-preview {
      width: 100%;
      height: 300px;
      background: linear-gradient(135deg, #2d5016 0%, #4a7a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .media-preview img, .media-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .spotify-player {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: white;
      padding: 30px 25px;
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .spotify-player::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(45, 80, 22, 0.3), rgba(122, 182, 72, 0.3));
      z-index: 0;
    }

    .spotify-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .spotify-art {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #2d5016, #7ab648);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5em;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .spotify-art.playing {
      animation: rotate 20s linear infinite;
    }

    .spotify-art.paused {
      animation-play-state: paused;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .spotify-info {
      margin-bottom: 20px;
    }

    .spotify-title {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spotify-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .spotify-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
    }

    .spotify-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .spotify-btn.play-btn {
      width: 60px;
      height: 60px;
      background: white;
      color: #2d5016;
      border: none;
      font-size: 1.5em;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .spotify-btn.play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .spotify-progress {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 15px;
      cursor: pointer;
    }

    .spotify-progress-bar {
      height: 100%;
      background: #7ab648;
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .spotify-time {
      display: flex;
      justify-content: space-between;
      font-size: 0.75em;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
    }

    .media-info {
      padding: 25px;
    }

    .media-title {
      font-size: 1.3em;
      font-weight: 600;
      color: #2d5016;
      margin-bottom: 10px;
    }

    .media-type {
      display: inline-block;
      padding: 5px 15px;
      background: linear-gradient(135deg, #2d5016, #4a7a2e);
      color: white;
      border-radius: 20px;
      font-size: 0.9em;
      margin-bottom: 10px;
      text-transform: capitalize;
    }

    .media-date {
      color: #666;
      font-size: 0.9em;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 1000px;
      margin: 50px auto;
      background: white;
      border-radius: 30px;
      padding: 30px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: #2d5016;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.5em;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-close:hover {
      background: #e74c3c;
      transform: rotate(90deg);
    }

    .modal-media {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .modal-media img, .modal-media video {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      background: #f5f5f5;
    }

    .modal-spotify {
      background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
      border-radius: 20px;
      padding: 60px 40px;
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .modal-spotify::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(45, 80, 22, 0.2), rgba(122, 182, 72, 0.2));
    }

    .modal-spotify > * {
      position: relative;
      z-index: 1;
    }

    .modal-spotify-art {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #2d5016, #7ab648);
      border-radius: 50%;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4em;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-spotify-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin: 30px 0;
    }

    .modal-spotify-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.3em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-spotify-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .modal-spotify-btn.play-btn {
      width: 70px;
      height: 70px;
      background: white;
      color: #2d5016;
      border: none;
      font-size: 1.8em;
    }

    .modal-spotify-progress {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      cursor: pointer;
      margin: 20px 0;
    }

    .modal-spotify-progress-bar {
      height: 100%;
      background: #7ab648;
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .modal-spotify-time {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      color: rgba(255, 255, 255, 0.6);
    }

    .modal-title {
      font-size: 2em;
      color: #2d5016;
      margin-bottom: 15px;
    }

    .footer {
      text-align: center;
      padding: 40px 20px;
      margin-top: 60px;
    }

    .admin-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .admin-link:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: white;
      font-size: 1.2em;
      grid-column: 1 / -1;
    }

    .loading-spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: white;
      font-size: 1.3em;
      opacity: 0.8;
      grid-column: 1 / -1;
    }

    .error-state {
      text-align: center;
      padding: 40px 20px;
      color: white;
      background: rgba(231, 76, 60, 0.3);
      border-radius: 15px;
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 2.5em; }
      .content-grid { grid-template-columns: 1fr; }
      .nav-tab { padding: 12px 20px; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <h1>Meu Portfólio</h1>
        <p>Trabalhos criativos em diferentes formatos e estilos</p>
      </div>
    </header>

    <nav class="nav-tabs" id="navTabs"></nav>

    <div class="content-grid" id="contentGrid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Carregando conteúdo...</p>
      </div>
    </div>

    <footer class="footer">
      <a href="admin.html" class="admin-link">🔐 Área Administrativa</a>
    </footer>
  </div>

  <div class="modal" id="mediaModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwqdoWCfgflY5MzRWw0BfJJ-Cgg3XiWVpJlQfQA9OrHXD9lSyYjhIY7vbOxvwJdAzN3/exec';
    let currentCategory = '';
    let categories = [];
    let currentAudio = null;
    
    document.addEventListener('DOMContentLoaded', () => {
      loadCategories();
    });

    async function loadCategories() {
      try {
        const response = await fetch(`${API_URL}?action=getCategories`);
        const data = await response.json();
        
        if (data.categories && data.categories.length > 0) {
          categories = data.categories;
          currentCategory = categories[0];
          renderNavTabs();
          loadCategoryContent(currentCategory);
        } else {
          // Fallback para categorias padrão
          categories = ['Jingle', 'Placa Pirulito', 'Praginha'];
          currentCategory = categories[0];
          renderNavTabs();
          loadCategoryContent(currentCategory);
        }
      } catch (error) {
        console.error('Erro ao carregar categorias:', error);
        categories = ['Jingle', 'Placa Pirulito', 'Praginha'];
        currentCategory = categories[0];
        renderNavTabs();
        loadCategoryContent(currentCategory);
      }
    }

    function renderNavTabs() {
      const navTabs = document.getElementById('navTabs');
      navTabs.innerHTML = categories.map(cat => 
        `<div class="nav-tab ${cat === currentCategory ? 'active' : ''}" 
             onclick="changeCategory('${cat}', this)">${cat}</div>`
      ).join('');
    }

    function changeCategory(category, element) {
      currentCategory = category;
      
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      
      document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
      element.classList.add('active');
      
      loadCategoryContent(category);
    }

    async function loadCategoryContent(category) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Carregando ${category}...</p>
        </div>
      `;
      
      try {
        const response = await fetch(`${API_URL}?action=list&category=${encodeURIComponent(category)}`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data.error) throw new Error(data.error);
        
        if (!data.files || data.files.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div style="font-size: 4em; margin-bottom: 20px;">📂</div>
              <p>Nenhum arquivo em ${category}</p>
            </div>
          `;
          return;
        }
        
        renderFiles(data.files);
        
      } catch (error) {
        console.error('Erro:', error);
        grid.innerHTML = `
          <div class="error-state">
            <p>Erro ao carregar conteúdo</p>
            <p style="font-size: 0.9em;">${error.message}</p>
            <button onclick="loadCategoryContent('${category}')" 
                    style="margin-top: 20px; padding: 10px 20px; background: white; color: #2d5016; 
                           border: none; border-radius: 20px; cursor: pointer; font-weight: 600;">
              Tentar novamente
            </button>
          </div>
        `;
      }
    }

    function renderFiles(files) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '';
      
      files.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.style.animationDelay = `${index * 0.1}s`;
        
        let previewHTML = '';
        
        if (file.tipo === 'imagem') {
          previewHTML = `
            <div class="media-preview">
              <img src="${file.url}" alt="${file.titulo}" 
                   onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23ddd%22 width=%22200%22 height=%22200%22/><text fill=%22%23999%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22>Erro</text></svg>'">
            </div>
          `;
        } else if (file.tipo === 'video') {
          previewHTML = `
            <div class="media-preview">
              <video muted loop>
                <source src="${file.url}" type="video/mp4">
              </video>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                          color: white; font-size: 3em; opacity: 0.8; pointer-events: none;">▶️</div>
            </div>
          `;
        } else if (file.tipo === 'audio') {
          previewHTML = `
            <div class="spotify-player" onclick="event.stopPropagation();">
              <div class="spotify-content">
                <div class="spotify-art paused" id="art_${file.id}">🎵</div>
                <div class="spotify-info">
                  <div class="spotify-title">${file.titulo || 'Áudio'}</div>
                </div>
                <div class="spotify-controls">
                  <button class="spotify-btn" onclick="event.stopPropagation(); skipAudio('${file.id}', -10)">
                    <i class="fas fa-backward"></i>
                  </button>
                  <button class="spotify-btn play-btn" onclick="event.stopPropagation(); toggleAudio('${file.id}', '${file.url}')" id="playBtn_${file.id}">
                    <i class="fas fa-play"></i>
                  </button>
                  <button class="spotify-btn" onclick="event.stopPropagation(); skipAudio('${file.id}', 10)">
                    <i class="fas fa-forward"></i>
                  </button>
                </div>
                <div class="spotify-progress" onclick="event.stopPropagation(); seekAudio(event, '${file.id}')">
                  <div class="spotify-progress-bar" id="progress_${file.id}"></div>
                </div>
                <div class="spotify-time">
                  <span id="currentTime_${file.id}">0:00</span>
                  <span id="duration_${file.id}">0:00</span>
                </div>
              </div>
              <audio id="audio_${file.id}" src="${file.url}" preload="metadata"></audio>
            </div>
          `;
        }
        
        card.innerHTML = `
          ${previewHTML}
          <div class="media-info">
            <div class="media-title">${file.titulo || 'Sem título'}</div>
            <span class="media-type">${file.tipo}</span>
            <div class="media-date">📅 ${file.data || 'Data não disponível'}</div>
          </div>
        `;
        
        grid.appendChild(card);
        
        if (file.tipo === 'audio') {
          setupAudioPlayer(file.id);
        }
      });
    }

    function setupAudioPlayer(id) {
      const audio = document.getElementById(`audio_${id}`);
      if (!audio) return;
      
      audio.addEventListener('loadedmetadata', () => {
        document.getElementById(`duration_${id}`).textContent = formatTime(audio.duration);
      });
      
      audio.addEventListener('timeupdate', () => {
        const progress = (audio.currentTime / audio.duration) * 100;
        const progressBar = document.getElementById(`progress_${id}`);
        const currentTime = document.getElementById(`currentTime_${id}`);
        if (progressBar) progressBar.style.width = progress + '%';
        if (currentTime) currentTime.textContent = formatTime(audio.currentTime);
      });
      
      audio.addEventListener('ended', () => {
        document.getElementById(`playBtn_${id}`).innerHTML = '<i class="fas fa-play"></i>';
        document.getElementById(`art_${id}`).classList.remove('playing');
        document.getElementById(`art_${id}`).classList.add('paused');
        currentAudio = null;
      });
    }

    function toggleAudio(id, url) {
      const audio = document.getElementById(`audio_${id}`);
      const playBtn = document.getElementById(`playBtn_${id}`);
      const art = document.getElementById(`art_${id}`);
      
      if (!audio) return;
      
      if (currentAudio && currentAudio !== audio) {
        const prevId = currentAudio.id.replace('audio_', '');
        const prevBtn = document.getElementById(`playBtn_${prevId}`);
        const prevArt = document.getElementById(`art_${prevId}`);
        if (prevBtn) prevBtn.innerHTML = '<i class="fas fa-play"></i>';
        if (prevArt) {
          prevArt.classList.remove('playing');
          prevArt.classList.add('paused');
        }
        currentAudio.pause();
      }
      
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        art.classList.remove('paused');
        art.classList.add('playing');
        currentAudio = audio;
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        art.classList.remove('playing');
        art.classList.add('paused');
        currentAudio = null;
      }
    }

    function skipAudio(id, seconds) {
      const audio = document.getElementById(`audio_${id}`);
      if (audio) {
        audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
      }
    }

    function seekAudio(event, id) {
      const audio = document.getElementById(`audio_${id}`);
      const progressBar = event.currentTarget;
      const rect = progressBar.getBoundingClientRect();
      const percent = (event.clientX - rect.left) / rect.width;
      
      if (audio) {
        audio.currentTime = percent * audio.duration;
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function closeModal() {
      document.getElementById('mediaModal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
